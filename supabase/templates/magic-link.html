<!--
  Filnevo — "Magic Link / OTP" email template.

  Paste this into Supabase: Dashboard → Authentication → Emails →
  "Confirm signup" → Message body (source).

  Supabase template variables:
    {{ .Token }}            6-digit OTP code
    {{ .ConfirmationURL }}  fallback link
    {{ .SiteURL }}          hosted logo base
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background-color:#0a0e17;">
  <tr>
    <td align="center" style="padding:48px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#0f1420;border:1px solid #1e293b;border-radius:24px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.4);">
        <!-- Brand header (Centered) -->
        <tr>
          <td align="center" style="padding:40px 32px 0 32px;">
            <img src="{{ .SiteURL }}/email-logo.svg" width="160" alt="Filnevo" style="display:inline-block;border:0;outline:none;text-decoration:none;height:auto;" />
          </td>
        </tr>

        <!-- Heading (Centered) -->
        <tr>
          <td align="center" style="padding:32px 32px 0 32px;">
            <h1 style="margin:0;font-family:'Bricolage Grotesque', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:24px;font-weight:700;color:#e6e9f0;letter-spacing:-0.02em;">
              Your sign-in code
            </h1>
            <p style="margin:12px 0 0 0;font-family:'Hanken Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.6;color:#94a3b8;">
              Enter this code on the sign-in screen to access your Filnevo account.
            </p>
          </td>
        </tr>

        <!-- Sign-in code (Middle) -->
        <tr>
          <td align="center" style="padding:32px 32px 16px 32px;">
            <div style="background-color:#0a0e17;border:1px solid #1e293b;border-radius:16px;padding:24px;text-align:center;">
              <div style="font-family:'Space Grotesk', 'SFMono-Regular', Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#64748b;margin-bottom:12px;">
                Sign-in code
              </div>
              <div style="font-family:'Space Grotesk', 'SFMono-Regular', Consolas, monospace;font-size:38px;font-weight:700;letter-spacing:0.3em;color:#3b82f6;">
                {{ .Token }}
              </div>
            </div>
          </td>
        </tr>

        <!-- Optional fallback link (Centered) -->
        <tr>
          <td align="center" style="padding:8px 32px 0 32px;">
            <p style="margin:0;font-family:'Hanken Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:1.6;color:#64748b;">
              Prefer a link? <a href="{{ .ConfirmationURL }}" style="color:#06b6d4;text-decoration:none;font-weight:600;">Your sign-in code here &rarr;</a>
            </p>
          </td>
        </tr>

        <!-- Footer (Centered & Branded) -->
        <tr>
          <td align="center" style="padding:40px 32px;border-top:1px solid #1e293b;margin-top:32px;">
            <p style="margin:0;font-family:'Hanken Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:1.6;color:#475569;">
              This code expires shortly. If you didn&rsquo;t request this, you can safely ignore this email.
            </p>

            <p style="margin:20px 0 0 0;font-family:'Space Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;color:#3b82f6;text-transform:uppercase;letter-spacing:0.15em;">
              &copy; 2026 Filnevo
            </p>

            <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:16px;">
              <tr>
                <td style="padding:0 10px;">
                  <a href="https://facebook.com/filnevo" style="text-decoration:none;">
                    <img src="https://img.icons8.com/material-rounded/24/3b82f6/facebook-new.png" width="20" height="20" alt="Facebook" style="display:block;border:0;" />
                  </a>
                </td>
                <td style="padding:0 10px;">
                  <a href="https://instagram.com/filnevo" style="text-decoration:none;">
                    <img src="https://img.icons8.com/material-rounded/24/06b6d4/instagram-new.png" width="20" height="20" alt="Instagram" style="display:block;border:0;" />
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
